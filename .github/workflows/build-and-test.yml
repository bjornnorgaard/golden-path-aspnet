name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            src/Directory.Packages.props

      - name: Restore
        run: dotnet restore GoldenPathAspnet.slnx

      - name: Build
        run: dotnet build GoldenPathAspnet.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution GoldenPathAspnet.slnx --no-build --configuration Release

  image:
    name: Build and push image
    needs: [build-and-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "value=$(bash .github/scripts/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/WebApi/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=webapi
          cache-to: type=gha,mode=max,scope=webapi

  pin:
    name: Pin test
    needs: [image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    env:
      SERVICE: webapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin tag in test
        run: bash .github/scripts/pin-test-and-push.sh "$SERVICE" "${{ needs.image.outputs.tag }}"
