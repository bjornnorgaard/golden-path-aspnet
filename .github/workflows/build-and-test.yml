name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: src

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: Restore
        run: dotnet restore GoldenPathAspnet.slnx

      - name: Build
        run: dotnet build GoldenPathAspnet.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution GoldenPathAspnet.slnx --no-build --configuration Release
