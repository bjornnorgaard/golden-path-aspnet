name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: src

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            src/Directory.Packages.props

      - name: Restore
        run: dotnet restore GoldenPathAspnet.slnx

      - name: Build
        run: dotnet build GoldenPathAspnet.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution GoldenPathAspnet.slnx --no-build --configuration Release

  image-build-and-push:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=$(.github/scripts/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/WebApi/Dockerfile
          push: true
          tags: ghcr.io/bjornnorgaard/golden-path-aspnet:${{ steps.tag.outputs.tag }}

  tag-pin:
    needs: image-build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin services.test.yaml and push
        run: .github/scripts/pin-test-and-push.sh webapi ${{ needs.image-build-and-push.outputs.tag }}
