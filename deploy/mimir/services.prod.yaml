dependencies:
  postgres:
    databaseName: golden_path_aspnet
    migrations: startup
    consumers:
      webapi:
        connectionEnv: ConnectionStrings__DefaultConnection
        canMigrate: true
  telemetry:
    consumers:
      webapi:
        endpointEnv: Telemetry__CollectorEndpoint   # operator injects the collector URL under this name

services:
  webapi:
    image:
      tag: "26.09.15-11.00-6c3cf42"    # promote workflow (production.yml) overwrites this — never hand-edit after first sync
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        visibility: internet
    probes:
      port: http
      liveness:
        path: /healthz
      readiness:
        path: /readyz
    env:
      - name: Telemetry__ServiceName
        value: golden-path-aspnet
      # ConnectionStrings__DefaultConnection, Authentication__Google__ClientId,
      # Authentication__Google__ClientSecret — operator injects as secrets, do not add here
