dependencies:
  postgres:
    databaseName: golden_path_aspnet
    migrations: startup
    consumers:
      webapi:
        connectionEnv: ConnectionStrings__DefaultConnection
        canMigrate: true
  telemetry:
    consumers:
      webapi:
        endpointEnv: Telemetry__CollectorEndpoint   # operator injects the collector URL under this name

services:
  webapi:
    image:
      tag: "26.09.10-16.03-8e289ed"    # promote workflow (production.yml) overwrites this — never hand-edit after first sync
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80
        visibility: internet
    probes:
      port: http
      liveness:
        path: /healthz
      readiness:
        path: /readyz
    env:
      - name: Telemetry__ServiceName
        value: golden-path-aspnet
      - name: Authentication__AllowedGitHubLogin
        value: "bjornnorgaard"
      # ConnectionStrings__DefaultConnection, Authentication__GitHub__ClientId,
      # Authentication__GitHub__ClientSecret — operator injects as secrets, do not add here
