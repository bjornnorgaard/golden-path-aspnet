// The gRPC contract mirrors the operations in the OpenAPI and GraphQL users contracts. See todos.proto for the error model.
syntax = "proto3";

package goldenpath.users.v1;

service UsersService {
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc GetUserList(GetUserListRequest) returns (GetUserListResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  string id = 1;
  string email = 2;
  optional string display_name = 3;
  optional string given_name = 4;
  optional string family_name = 5;
  optional string avatar_url = 6;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUserByIdResponse {
  User user = 1;
}

message GetUserListRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
}

message GetUserListResponse {
  repeated User users = 1;
}

message UpdateUserRequest {
  string id = 1;
  optional string display_name = 2;
  optional string given_name = 3;
  optional string family_name = 4;
  optional string avatar_url = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  string id = 1;
}
